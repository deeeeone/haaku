# Trakt parity manifest - the machine-checkable answer to "how much of Trakt do we serve?".
#
# Source of truth for the Trakt side: haaku-tv/haaku issue #4, sections A and B
# (the inventory the issue produced by diffing our spec against
# trakt/trakt-api contracts). The "ours" side is checked against the live
# code-first route registry - never against a hand-kept list.
#
# Graded by ./cmd/parity (make parity-check), which fails when:
#   * a row marked implemented/divergent names a route that is not registered,
#   * a row names a registered route but a status that contradicts it (a serving
#     route must be implemented/divergent; a 501 route must be blocked-engine),
#   * a registered route that answers 501 is not recorded here as blocked-engine,
#   * a route we serve has an inventory row here graded blocked/out-of-scope/
#     blocked-data - the manifest may not under-report what we ship (matched by
#     Trakt-shaped path, so our {media_type} and Trakt's {type} are the same
#     segment),
#   * a blocked-engine row does not name its engine, or a divergent row has no
#     compat note.
#
# Statuses:
#   implemented     a registered route serves this data at the Trakt path
#   divergent       a registered route serves this data, different path/params
#                   (the compat listener in issue #7 is the bridge)
#   blocked-engine  no route serves it; a named engine must land first
#   blocked-data    no route serves it; the data is not in our store/schema
#   out-of-scope    deliberately not served; the rationale starts with
#                   "decision:" (declined) or "deferred:" (buildable, not built).
#                   Rows for our own surface also accept "custom:".
#
# Rows whose Trakt path is empty describe our own non-Trakt surface (issue #4
# section C) so the map is complete; they are excluded from Trakt coverage.
#
# Hand-maintained, not generated: one row per Trakt endpoint, kept in the order
# issue #4 lists them so a diff against the issue reads. The "ours" value must be
# copied verbatim from the registry (internal/httpapi/routes.go or openapi.yaml);
# the gate fails if it does not match.

manifest: 1
upstream: "trakt/trakt-api contracts (projects/api/src/contracts), as inventoried in issue #4 on 2026-11-05"
notes:
  - "GET /v1/movies/recommendations/{id} and GET /v1/shows/recommendations/{id} were registered as handlers returning a hard-coded empty array with 200 - a fabricated 200, which this repo forbids (a made-up payload is worse than an honest 501). They now answer 501 not_implemented and are recorded as custom blocked-engine rows in the last section, so make parity-check measures them rather than trusting prose."
sections:
  - name: "Calendars"
    rows:
      - trakt: "GET /calendars/{target}/movies/{start_date}/{days}"
        ours: "GET /v1/calendars/all/movies/{start_date}/{days}"
        status: implemented
        rationale: "Serves real rows from movies.released inside the window (calendar.handleCalendarMovies), paginated; the Trakt-shaped path and params are identical."
      - trakt: "GET /calendars/{target}/dvd/{start_date}/{days}"
        ours: "GET /v1/calendars/{target}/dvd/{start_date}/{days}"
        status: blocked-data
        rationale: "movies carries a single released DATE; there is no dvd/digital/physical date column, so a DVD calendar cannot be answered without inventing dates."
      - trakt: "GET /calendars/{target}/streaming/{start_date}/{days}"
        ours: "GET /v1/calendars/{target}/streaming/{start_date}/{days}"
        status: blocked-data
        rationale: "No streaming-release date is stored; watch providers live in movies.metadata per title (TMDB), not as dated releases."
      - trakt: "GET /calendars/releases/hot/{start_date}/{days}"
        ours: "GET /v1/calendars/releases/hot/{start_date}/{days}"
        status: blocked-data
        rationale: "No unified release feed: 'hot' mixes theatrical, streaming and episode releases in one ranked list; we store only movies.released and episodes.aired_at, with no cross-medium ranking."
      - trakt: "GET /calendars/releases/hot/new/{start_date}/{days}"
        ours: "GET /v1/calendars/all/shows/{start_date}/{days}"
        status: divergent
        rationale: "The same row set (series premieres in a window) is served by the episode calendar with the subtype as a query param."
        compat: "ours is ?type=new on the shows calendar; the compat listener maps the /new/{date}/{days} segments onto ?type=new. Ordering differs (date-ordered here, 'hot'-ranked upstream)."
      - trakt: "GET /calendars/releases/hot/premieres/{start_date}/{days}"
        ours: "GET /v1/calendars/all/shows/{start_date}/{days}"
        status: divergent
        rationale: "Season premieres in a window are served by the episode calendar with ?type=premieres."
        compat: "?type=premieres (season_number > 1, episode 1); the compat listener maps the path segments onto it."
      - trakt: "GET /calendars/releases/hot/finales/{start_date}/{days}"
        ours: "GET /v1/calendars/all/shows/{start_date}/{days}"
        status: divergent
        rationale: "Season finales in a window are served by the episode calendar with ?type=finale."
        compat: "?type=finale (last episode of a season); Trakt spells the segment 'finales', the compat listener must map the name as well as the shape."
  - name: "Media"
    rows:
      - trakt: "GET /media/trending"
        ours: "GET /v1/media/trending"
        status: blocked-engine
        rationale: "Per-type feeds exist (/v1/movies/trending, /v1/shows/trending) but a single cross-type ranked feed needs the rankings engine."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /media/popular"
        ours: "GET /v1/media/popular"
        status: blocked-engine
        rationale: "Our popularity is movies/shows.popularity; one feed ranked across both media types is the rankings engine's job."
        engine: "stats/rankings engine (issue #66)"
  - name: "Movies"
    rows:
      - trakt: "GET /movies/watched/{period}"
        ours: "GET /v1/movies/watched/{period}"
        status: blocked-engine
        rationale: "Distinct watchers per period is a period-activity aggregate we do not compute yet."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /movies/played/{period}"
        ours: "GET /v1/movies/played/{period}"
        status: blocked-engine
        rationale: "Play counts per period need the same aggregate as watched/{period}."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /movies/collected/{period}"
        ours: "GET /v1/movies/collected/{period}"
        status: blocked-engine
        rationale: "Collector counts per period require the rankings engine's period rollups."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /movies/anticipated"
        ours: "GET /v1/media/anticipated"
        status: divergent
        rationale: "The watchlist-weighted anticipation score is served by the media-wide anticipated feed, which already filters by type."
        compat: "ours takes ?type=movie; the compat listener maps /movies/anticipated onto it. Auth is required here (Trakt allows optional auth)."
      - trakt: "GET /movies/hot"
        ours: "GET /v1/movies/hot"
        status: blocked-engine
        rationale: "hot is watchers in the last 24 hours; we store no windowed watcher counts (movies/trending is popularity-ordered, not play-ordered)."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /movies/streaming/{period}"
        ours: "GET /v1/movies/streaming/{period}"
        status: blocked-data
        rationale: "Trakt's streaming list is driven by streaming release dates, which we do not store (see /calendars/all/streaming)."
      - trakt: "GET /movies/boxoffice"
        ours: ""
        status: out-of-scope
        rationale: "decision: Trakt's /movies/boxoffice is a weekend box-office chart; TMDB dropped box-office figures and carries only a lifetime `revenue` number, which is a different measurement. No honest source, so it is declined rather than filled with a number that is not the one the contract names."
      - trakt: "GET /movies/updates/id/{start_date}"
        ours: "GET /v1/movies/updates/id/{start_date}"
        status: implemented
        rationale: "Trakt-ID-keyed update feed, landed with the rest of issue #4's read work; same path and params."
      - trakt: "GET /movies/{id}/related"
        ours: "GET /v1/movies/{id}/related"
        status: blocked-engine
        rationale: "Needs the recommendation graph. Our own route GET /v1/movies/recommendations/{id} is the nearest surface but answers 501 not_implemented (its custom-surface row is in the last section), and Trakt's /movies/{id}/related is a distinct surface, so neither is parity here."
        engine: "recommendations engine (issue #49)"
      - trakt: "GET /movies/{id}/releases/{country}"
        ours: "GET /v1/movies/{id}/releases/{country}"
        status: blocked-data
        rationale: "movies has one released DATE; per-country release types (theatrical/digital/physical) are not modelled."
      - trakt: "GET /movies/{id}/videos"
        ours: "GET /v1/movies/{id}/videos"
        status: blocked-data
        rationale: "No videos table and no TMDB video ingest, so there is nothing to serve."
      - trakt: "GET /movies/{id}/comments/{sort}"
        ours: "GET /v1/movies/{id}/comments/{sort}"
        status: implemented
        rationale: "Landed with the media comment reads: real rows from comments(media_type='movie', media_id) with the same sort vocabulary as Trakt (newest|oldest|likes|replies|trending)."
      - trakt: "GET /movies/{id}/sentiments"
        ours: ""
        status: out-of-scope
        rationale: "decision: Trakt derives sentiments from a per-episode sentiment model over its whole comment corpus; nothing in a self-hosted instance produces that signal, and inventing a score is exactly the fabricated payload this manifest forbids. Declined, tracked here so it can be revisited if a scorer is ever built."
      - trakt: "GET /movies/{id}/studios"
        ours: "GET /v1/movies/{id}/studios"
        status: blocked-data
        rationale: "No production-company table; TMDB company ids are not ingested."
      - trakt: "GET /movies/{id}/watchnow/{country}"
        ours: "GET /v1/movies/{id}/watch"
        status: divergent
        rationale: "Same TMDB provider payload (flatrate/rent/buy, cached in movies.metadata) served under a different segment with the country as a query param."
        compat: "compat listener rewrites /movies/{id}/watchnow/{country} -> /v1/movies/{id}/watch?country={country}; the envelope is ours, not Trakt's."
      - trakt: "GET /movies/{id}/lists/{type}/{sort}"
        ours: "GET /v1/movies/{id}/lists/{type}/{sort}"
        status: blocked-engine
        rationale: "The closest route is registered but answers 501; the per-type/per-sort variant cannot land before the lists engine."
        engine: "lists engine (issue #67)"
      - trakt: "GET /movies/{id}/stats"
        ours: "GET /v1/movies/{id}/stats"
        status: blocked-engine
        rationale: "Registered but responds 501 not_implemented by design - it must not be counted as parity."
        engine: "stats engine (issue #86)"
      - trakt: "GET /movies/{id}/watching"
        ours: "GET /v1/movies/{id}/watching"
        status: blocked-engine
        rationale: "Registered but responds 501 not_implemented; users currently watching come from the activity/scrobble path."
        engine: "activity engine"
  - name: "Shows"
    rows:
      - trakt: "GET /shows/watched/{period}"
        ours: "GET /v1/shows/watched/{period}"
        status: blocked-engine
        rationale: "Period distinct watchers for shows need the period-activity aggregate."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /shows/played/{period}"
        ours: "GET /v1/shows/played/{period}"
        status: blocked-engine
        rationale: "Period play counts for shows need the same aggregate."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /shows/collected/{period}"
        ours: "GET /v1/shows/collected/{period}"
        status: blocked-engine
        rationale: "Period collector counts need the rankings engine rollups."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /shows/anticipated"
        ours: "GET /v1/media/anticipated"
        status: divergent
        rationale: "Watchlist-weighted anticipation, already filtered by type on the media-wide feed."
        compat: "ours takes ?type=show; the compat listener maps /shows/anticipated onto it."
      - trakt: "GET /shows/hot"
        ours: "GET /v1/shows/hot"
        status: blocked-engine
        rationale: "hot needs windowed watcher counts we do not compute (shows/trending is popularity-ordered)."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "GET /shows/streaming/{period}"
        ours: "GET /v1/shows/streaming/{period}"
        status: blocked-data
        rationale: "Driven by streaming release dates, which are not stored (see /calendars/all/streaming)."
      - trakt: "GET /shows/updates/id/{start_date}"
        ours: "GET /v1/shows/updates/id/{start_date}"
        status: implemented
        rationale: "Trakt-ID-keyed update feed; same path and params."
      - trakt: "GET /shows/{id}/related"
        ours: "GET /v1/shows/{id}/related"
        status: blocked-engine
        rationale: "Needs the recommendation graph; our own route GET /v1/shows/recommendations/{id} is the nearest surface but answers 501 not_implemented (see the custom-surface row in the last section)."
        engine: "recommendations engine (issue #49)"
      - trakt: "GET /shows/{id}/videos"
        ours: "GET /v1/shows/{id}/videos"
        status: blocked-data
        rationale: "No videos table and no TMDB video ingest."
      - trakt: "GET /shows/{id}/comments/{sort}"
        ours: "GET /v1/shows/{id}/comments/{sort}"
        status: implemented
        rationale: "Landed with the media comment reads: real rows from comments(media_type='show', media_id), same sort vocabulary as Trakt."
      - trakt: "GET /shows/{id}/sentiments"
        ours: ""
        status: out-of-scope
        rationale: "decision: same as /movies/{id}/sentiments — no sentiment scorer exists and none is planned, and a fabricated score is worse than an honest absence."
      - trakt: "GET /shows/{id}/studios"
        ours: "GET /v1/shows/{id}/studios"
        status: blocked-data
        rationale: "No production-company table; shows.network is a network, not the studio list Trakt returns."
      - trakt: "GET /shows/{id}/certifications"
        ours: "GET /v1/shows/{id}/certifications"
        status: blocked-data
        rationale: "shows.certification is a single value; Trakt returns certifications keyed by country, which is not modelled."
      - trakt: "GET /shows/{id}/next_episode"
        ours: "GET /v1/shows/{id}/next_episode"
        status: implemented
        rationale: "Landed: earliest episode airing today or later, with the same 204-when-none contract."
      - trakt: "GET /shows/{id}/last_episode"
        ours: "GET /v1/shows/{id}/last_episode"
        status: implemented
        rationale: "Landed: most recently aired episode, 204 when there is none."
      - trakt: "GET /shows/{id}/progress/watched"
        ours: "GET /v1/shows/{id}/progress/watched"
        status: implemented
        rationale: "Landed: aired vs watched episodes per season computed from the episodes table plus the caller's user_history rows; Trakt's reset_at is omitted because nothing stores it."
      - trakt: "GET /shows/{id}/progress/collection"
        ours: "GET /v1/shows/{id}/progress/collection"
        status: implemented
        rationale: "Landed: same per-season breakdown pinned to the caller's user_collection rows (aired vs collected episodes)."
      - trakt: "DELETE /shows/{id}/progress/watched/reset"
        ours: "DELETE /v1/shows/{id}/progress/watched/reset"
        status: blocked-engine
        rationale: "Resetting progress can only exist once progress is computed and stored."
        engine: "stats/rankings engine (issue #66)"
      - trakt: "POST /shows/{id}/progress/watched/reset"
        ours: "POST /v1/shows/{id}/progress/watched/reset"
        status: implemented
        rationale: "Landed: deletes the caller's episode watch-history for that show only and returns the recomputed watched progress (Trakt's shape)."
      - trakt: "GET /shows/{id}/lists/{type}/{sort}"
        ours: "GET /v1/shows/{id}/lists/{type}/{sort}"
        status: blocked-engine
        rationale: "The closest route answers 501; the type/sort variant needs the lists engine."
        engine: "lists engine (issue #67)"
      - trakt: "GET /shows/{id}/watchnow/{country}"
        ours: "GET /v1/shows/{id}/watch"
        status: divergent
        rationale: "Same TMDB provider payload, different segment name and country-in-query shape."
        compat: "compat listener rewrites /shows/{id}/watchnow/{country} -> /v1/shows/{id}/watch?country={country}."
      - trakt: "GET /shows/{id}/stats"
        ours: "GET /v1/shows/{id}/stats"
        status: blocked-engine
        rationale: "Registered but responds 501 not_implemented; not parity."
        engine: "stats engine (issue #86)"
      - trakt: "GET /shows/{id}/watching"
        ours: "GET /v1/shows/{id}/watching"
        status: blocked-engine
        rationale: "Registered but responds 501 not_implemented; needs the activity engine."
        engine: "activity engine"
      - trakt: "GET /shows/{id}/seasons/{season}"
        ours: "GET /v1/seasons/{id}"
        status: divergent
        rationale: "The same season record is served top-level (flat ids), not nested under the show."
        compat: "ours resolves a season by our internal id; the compat listener must resolve show+season_number to that id and nest the payload."
      - trakt: "GET /shows/{id}/seasons/{season}/episodes/{episode}"
        ours: "GET /v1/episodes/{id}"
        status: divergent
        rationale: "The same episode record is served top-level (flat ids), not nested under show/season."
        compat: "same as the season row: the listener resolves show+season+episode to our episode id and nests the payload."
      - trakt: "GET /shows/{id}/seasons/{season}/translations"
        ours: "GET /v1/shows/{id}/seasons/{season}/translations/{lang}"
        status: divergent
        compat: "we require {lang} as a path segment; the contract takes the language as a query param"
        rationale: "Nested season translations already exist in Trakt shape."
      - trakt: "GET /shows/{id}/seasons/{season}/ratings"
        ours: "GET /v1/seasons/{id}/ratings"
        status: divergent
        rationale: "Season rating distribution is served flat, keyed by our season id."
        compat: "listener resolves show+season_number to the flat route; the body shape (distribution) is already shared."
      - trakt: "GET /shows/{id}/seasons/{season}/stats"
        ours: "GET /v1/seasons/{id}/stats"
        status: divergent
        rationale: "Season stats (watchers/plays/rating) are served flat, keyed by our season id."
        compat: "listener resolves show+season_number to the flat route."
      - trakt: "GET /shows/{id}/seasons/{season}/comments/{sort}"
        ours: "GET /v1/shows/{id}/seasons/{season}/comments/{sort}"
        status: divergent
        compat: "{sort} is accepted and ignored: one ordering, newest first"
        rationale: "Season comments landed served nested under the show, but our route carries a trailing {sort} segment Trakt's does not (and defaults to newest)."
      - trakt: "GET /shows/{id}/seasons/{season}/lists/{type}/{sort}"
        ours: ""
        status: out-of-scope
        rationale: "deferred: list items can reference a season, but no per-season list route exists."
      - trakt: "GET /shows/{id}/seasons/{season}/people"
        ours: "GET /v1/shows/{id}/seasons/{season}/people"
        status: blocked-data
        rationale: "Season credits are not ingested: the credits table takes a media_type, but only movie/show credits are written today."
      - trakt: "GET /shows/{id}/seasons/{season}/videos"
        ours: "GET /v1/shows/{id}/seasons/{season}/videos"
        status: blocked-data
        rationale: "No videos table and no TMDB video ingest."
      - trakt: "GET /shows/{id}/seasons/{season}/episodes/{episode}/comments/{sort}"
        ours: "GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/comments/{sort}"
        status: divergent
        rationale: "Episode comments are now served nested under the show (landed with the media comment reads); our route carries a trailing {sort} segment Trakt's does not. A flat /v1/episodes/{id}/comments route also still exists."
        compat: "listener resolves show+season+episode to our episode id and delegates; the trailing {sort} defaults to newest."
      - trakt: "GET /shows/{id}/seasons/{season}/episodes/{episode}/lists/{type}/{sort}"
        ours: "GET /v1/episodes/{id}/lists"
        status: divergent
        rationale: "Lists containing the episode exist, served flat by episode id."
        compat: "listener resolves the nested episode to our id and delegates to the flat route."
      - trakt: "GET /shows/{id}/seasons/{season}/episodes/{episode}/people"
        ours: "GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/people"
        status: blocked-data
        rationale: "Episode credits are not ingested (credits table is written for movie/show only)."
      - trakt: "GET /shows/{id}/seasons/{season}/episodes/{episode}/videos"
        ours: "GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/videos"
        status: blocked-data
        rationale: "No videos table and no TMDB video ingest."
  - name: "People"
    rows:
      - trakt: "GET /people/{id}/lists/{type}/{sort}"
        ours: "GET /v1/people/{id}/lists/{type}/{sort}"
        status: blocked-engine
        rationale: "Lists containing a person need the lists engine; no per-person list route exists."
        engine: "lists engine (issue #67)"
  - name: "Recommendations"
    rows:
      - trakt: "DELETE /recommendations/movies/{id}"
        ours: "DELETE /v1/recommendations/movies/{id}"
        status: blocked-engine
        rationale: "Hiding a recommendation is a decision the recommendations engine does not model yet (the user_hidden table is not wired to it)."
        engine: "recommendations engine (issue #49)"
      - trakt: "DELETE /recommendations/shows/{id}"
        ours: "DELETE /v1/recommendations/shows/{id}"
        status: blocked-engine
        rationale: "Same as the movie dismissal: no per-item hide decision is modelled."
        engine: "recommendations engine (issue #49)"
  - name: "Sync"
    rows:
      - trakt: "GET /sync/last_activities"
        ours: "GET /v1/sync/last_activities"
        status: implemented
        rationale: "Landed with issue #6: MAX() stamps per collection, same path and contract."
      - trakt: "GET /sync/collection/movies"
        ours: "GET /v1/sync/collection/movies"
        status: implemented
        rationale: "Landed as a per-type read: the collection handler with media_type pinned to 'movie' by the path segment, Trakt's exact path."
      - trakt: "GET /sync/collection/shows"
        ours: "GET /v1/sync/collection/shows"
        status: implemented
        rationale: "Landed as a per-type read pinned to media_type='show'."
      - trakt: "GET /sync/collection/episodes"
        ours: "GET /v1/sync/collection/episodes"
        status: blocked-data
        rationale: "user_collection.media_type is 'movie' or 'show' only; an episode collection row cannot be stored."
      - trakt: "GET /sync/watchlist/{type}/{sort_by}/{sort_how}"
        ours: "GET /v1/sync/watchlist/movies"
        status: divergent
        compat: "served flat at /v1/sync/watchlist/{type} for movies and shows; the {sort_by}/{sort_how} segments are not implemented (no sort), and seasons/episodes are blocked on data (#71)"
        rationale: "Landed as a per-type read pinned to media_type='movie'."
      - trakt: "GET /sync/ratings/{type}/{rating}"
        ours: "GET /v1/sync/ratings/movies"
        status: divergent
        compat: "served flat at /v1/sync/ratings/{type} for all four types; the {rating} filter segment is not implemented"
        rationale: "Landed as a per-type read pinned to media_type='movie'."
      - trakt: "GET /sync/favorites/{type}/{sort_by}/{sort_how}"
        ours: "GET /v1/sync/favorites/movies"
        status: divergent
        compat: "served flat at /v1/sync/favorites/{type} for movies and shows; the {sort_by}/{sort_how} segments are not implemented"
        rationale: "Landed as a per-type read pinned to media_type='movie'."
      - trakt: "GET /sync/history/{type}/{id}"
        ours: "GET /v1/sync/history/movies"
        status: divergent
        compat: "custom: our per-type list lives at /v1/sync/history/{type}; the contract's /sync/history/{type}/{id} is the single-item read, and the per-type lists are on the profile surface (/users/{id}/history/{type})"
        rationale: "Landed as a per-type read pinned to media_type='movie'."
      - trakt: "GET /sync/collection/{type}"
        ours: "GET /v1/sync/collection"
        status: divergent
        rationale: "Media type is a query param; the ?extended=min / ?minimal response narrowing is not implemented - decision: narrowing is an optimisation, and a client that sends it still receives a valid (fuller) body, so no shim is planned."
        compat: "listener maps /sync/collection/{type} -> /v1/sync/collection?type=...; the narrowing params are accepted and ignored."
  - name: "Users"
    rows:
      - trakt: "GET /users/{id}/collection/{type}"
        ours: "GET /v1/users/{id}/collection/{media_type}"
        status: implemented
        rationale: "Same handler, media type as a path segment (movie|show|all), same PrivacyFilter gate."
      - trakt: "GET /users/{id}/history/"
        ours: "GET /v1/users/{id}/history"
        status: implemented
        rationale: "Landed: real rows from user_history in our sync HistoryResponse shape, PrivacyFilter-gated."
      - trakt: "GET /users/{id}/history/{type}/{item_id}"
        ours: "GET /v1/users/{id}/history/{media_type}/{media_id}"
        status: implemented
        rationale: "Landed: one item's play rows, resolving {media_id} by local id, slug or ?id_type= external id. The per-item variant is included."
      - trakt: "GET /users/{id}/ratings/"
