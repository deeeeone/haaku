name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          go test ./...
          # _tests_/ is a standalone "command-line-arguments" package (underscore
          # dirs are invisible to `go test ./...`), so run it via explicit files.
          go test ./_tests_/*.go

      # TODO(T0.3): govulncheck, gitleaks secret scan, OpenAPI freshness check
      # (generated openapi.yaml diff), golangci-lint.
