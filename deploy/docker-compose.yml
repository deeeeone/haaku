# trakt-api — local dev stack (Phase 0 infra)
# Postgres, Redis, MinIO, clerk-emulator, Mailpit.
# The api/web services get Dockerfiles in T0.x and join this file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trakt
      POSTGRES_PASSWORD: trakt
      POSTGRES_DB: trakt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trakt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trakt
      MINIO_ROOT_PASSWORD: trakt-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Clerk emulator (github.com/pjsny/clerk-emulator, Apache-2.0) — real JWTs,
  # no network. Used for local + self-hosted dev until Phase 2 (hosted Clerk).
  # Secret: sk_test_emulate · API: http://localhost:4000
  clerk-emulator:
    image: node:22-alpine
    command: ["npx", "--yes", "clerk-emulator", "--persist", "/data"]
    environment:
      PORT: "4000"
      CLERK_PERSIST: /data
    ports:
      - "4000:4000"
    volumes:
      - clerkdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  pgdata:
  miniodata:
  clerkdata:
