# gitleaks configuration (issue #8).
#
# `make secrets` runs `gitleaks git`, so the whole history is scanned: a secret
# that was committed and later removed still fails the gate. That is the point.
#
# The allowlist below is deliberately narrow — a rule AND the exact file — so it
# grandfathers two synthetic high-entropy literals in test fixtures and nothing
# else. A real key pasted into any other file, or into these files in a new
# commit, is still reported.
[extend]
useDefault = true

[[allowlists]]
description = '''
Synthetic credential-shaped literals in test fixtures, not secrets:
 - internal/handlers/webhooks/ssrf_test.go: a webhook secret literal used to drive SSRF checks
 - _tests_/oauth_test.go: an API-key-shaped string used to prove hashing is deterministic
Both are `generic-api-key` matches on high entropy alone. Any other rule, or any
other file, is still reported.
'''
paths = [
  '''^internal/handlers/webhooks/ssrf_test\.go$''',
  '''^_tests_/oauth_test\.go$''',
]
targetRules = ['generic-api-key']

# One historical fixture, matched by VALUE rather than by file.
#
# internal/config's config_test.go used to set HAAKU_SECRET_KEY to the 32-character
# hex string below, to satisfy the boot-time length check. It is a fixture, not a
# secret, but `make secrets` scans commits, so fixing the file forward cannot clear
# it: the commit that introduced it keeps matching until the history is rewritten.
# The fixture now builds its value at runtime (strings.Repeat), so this literal
# exists nowhere in the tree and this entry grandfathers the one finding on main.
#
# The pattern is anchored to the whole secret on purpose. Gitleaks matches an
# allowlist regex against the finding's secret, so an unanchored copy would also
# suppress a LONGER key that merely contains this one as a substring — a real
# credential pasted next to the fixture would be silenced. Proved both ways with
# `gitleaks dir` over two fixtures:
#
#   apiKey = "0123456789abcdef0123456789abcdefZq7x9Kd2Lm4Np6Rt"  # 48 chars
#   apiKey = "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"           # 40 chars, unrelated
#
# unanchored: the 48-char key was NOT reported (only the unrelated one).
# anchored:   both are reported, and this exact fixture is not.
#
# condition = "AND" keeps the rule and the value both required, so a different
# literal of the same shape, in any file, is still reported. Delete this entry
# when main is next rewritten.
[[allowlists]]
description = '''Historical synthetic HAAKU_SECRET_KEY fixture in internal/config (now runtime-built)'''
condition = "AND"
regexes = ['^0123456789abcdef0123456789abcdef$']
targetRules = ['generic-api-key']
