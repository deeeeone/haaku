# The omnibus install: one container with its own PostgreSQL and Redis, and
# `docker compose up -d` is the whole thing. See
# docs/architecture/omnibus-image.md.
#
#   cp .env.example .env      # then set HAAKU_SECRET_KEY and TMDB_API_TOKEN
#   docker compose up -d
#
# Everything lives in ./config: the database, the Redis append-only file, the
# app's own directory, and the pre-migration backups. Back that directory up
# together with HAAKU_SECRET_KEY — a database dump without the key is
# unreadable, and the key without the dump is useless.
#
# For a database and cache of your own instead, use docker-compose.advanced.yml.
#
# The app runs the background workers (webhook delivery, activity fan-out, the
# event outbox, the TMDB upkeep jobs) inside the API process, so one container
# is still the whole install. To hand them to a process of their own instead,
# set HAAKU_WORKER_SERVICE=true (and optionally HAAKU_WORKER_SERVICE_SELECTION
# to a subset): the init then starts a second service in this container and
# turns the API's own workers off, so each worker runs in exactly one place. See
# docs/architecture/workers.md.

services:
  haaku:
    image: ${HAAKU_IMAGE:-ghcr.io/haaku-tv/haaku:latest}
    container_name: haaku
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host port only. The container listens on 8080 and stays there.
      - "${HAAKU_PORT:-8080}:8080"
    volumes:
      - ${HAAKU_CONFIG:-./config}:/config
    # The API drains before PostgreSQL's fast shutdown (s6 stops services in
    # reverse order), and a first start applies every migration.
    stop_grace_period: 2m
    healthcheck:
      # Long start period on purpose: on a large database the first start runs
      # migrations for minutes, and not being healthy until then is correct.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
